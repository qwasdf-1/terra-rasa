[project]
name = "terra-rasa-testing"
version = "0.1.0"
description = "Real dedicated-server integration tests for the Terra Rasa mod"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = ["pytest>=8.3", "mc-testkit"]

[tool.uv]
package = false

[tool.uv.sources]
# The shared test kit lives in the private mc-tooling repository, checked out next to this one
# (../mc-tooling), as in the mc-mods workspace and in CI.
mc-testkit = { path = "../../mc-tooling/mc-testkit", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "neoforge: applies to the NeoForge install only (./gradlew integrationTest -Ploader=neoforge)",
]
