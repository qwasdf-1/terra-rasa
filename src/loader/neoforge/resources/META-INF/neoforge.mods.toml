modLoader="javafml"
loaderVersion="[4,)"
license="Apache-2.0"
issueTrackerUrl="https://github.com/qwasdf-1/terra-rasa/issues"

[[mods]]
modId="terrarasa"
version="${version}"
displayName="Terra Rasa"
description="Prepares and swaps freshly seeded canonical dimensions on dedicated and integrated servers."

# The table name is this mod's own id: NeoForge reads [[dependencies.<modId>]] for each mod's
# dependencies, and the modId field inside each entry names the dependency.
[[dependencies.terrarasa]]
modId="neoforge"
type="required"
versionRange="[${loader_version},)"
ordering="NONE"
side="SERVER"

[[dependencies.terrarasa]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="SERVER"

[[mixins]]
config="${mixins_config}"
