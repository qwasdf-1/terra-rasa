// Shared setup for mods in mc-mods.
// Applied after the platform plugin; `ext.modArchiveName` must be set before applying.

def javaVersion = rootProject.java_version.toInteger()
def minecraftVersion = rootProject.minecraft_version
def minecraftFamily = {
    if (minecraftVersion.startsWith('26.')) return 'modern'
    if (minecraftVersion == '1.21.11') return 'legacy'
    return 'classic'
}()
def loader = rootProject.loader
def neoforgeLoader = loader == 'neoforge'
def obfuscatedMinecraft = minecraftVersion.startsWith('1.')

group = rootProject.maven_group
version = rootProject.mod_version
base {
    // The loader tag keeps Fabric and NeoForge artifacts of the same game version apart.
    archivesName = "${project.ext.modArchiveName}-mc${minecraftVersion}${neoforgeLoader ? '-neoforge' : ''}"
}

repositories {
    mavenCentral()
    mavenLocal()
}

// Each project resolves its own overlays: the library and the test host keep separate
// src/loader/ and src/versions/ trees, and reading the root's would put the library's entrypoint
// and metadata into the test host's jar.
if (project.file("src/versions/${minecraftFamily}/java").exists()) {
    sourceSets.main.java.srcDir(project.file("src/versions/${minecraftFamily}/java"))
}
if (project.file("src/versions/${minecraftFamily}/resources").exists()) {
    sourceSets.main.resources.srcDir(project.file("src/versions/${minecraftFamily}/resources"))
}
if (project.file("src/loader/${loader}/java").exists()) {
    sourceSets.main.java.srcDir(project.file("src/loader/${loader}/java"))
}
def versionLoaderDir = project.file("src/loader/${loader}/versions/${minecraftFamily}/java")
if (versionLoaderDir.exists()) {
    sourceSets.main.java.srcDir(versionLoaderDir)
} else if (minecraftFamily == 'classic') {
    def legacyLoaderDir = project.file("src/loader/${loader}/versions/legacy/java")
    if (legacyLoaderDir.exists()) {
        sourceSets.main.java.srcDir(legacyLoaderDir)
    }
}
if (project.file("src/loader/${loader}/resources").exists()) {
    sourceSets.main.resources.srcDir(project.file("src/loader/${loader}/resources"))
}

dependencies {
    compileOnly 'org.jspecify:jspecify:1.0.0'
    if (neoforgeLoader) {
        // ModDevGradle supplies the NeoForge runtime and the matching Minecraft jars.
        project.extensions.getByName('neoForge').version = rootProject.neoforge_version
        if (rootProject.hasProperty('terra_rasa_version') && project.name != 'terra-rasa' && project.name != 'testhost') {
            // NeoForge has no jar-in-jar equivalent of Loom's `include`, so Terra Rasa stays a declared
            // dependency (see META-INF/neoforge.mods.toml) and is installed as its own mod.
            implementation "dev.terrarasa:terra-rasa-mc${minecraftVersion}-neoforge:${rootProject.terra_rasa_version}"
        }
        // The unit tests exercise loader-neutral logic on the development Minecraft jars, so they
        // take the same artifacts the main compile uses instead of the production runtime ones. No
        // loader is activated in the test JVM: no test in either mod touches a loader API.
        project.gradle.projectsEvaluated {
            ['testCompileClasspath', 'testRuntimeClasspath'].each { name ->
                project.configurations.named(name).configure {
                    extendsFrom(project.configurations.named('modDevCompileDependencies').get())
                }
            }
        }
    } else {
        minecraft "com.mojang:minecraft:${minecraftVersion}"
        def modConfiguration = (obfuscatedMinecraft || minecraftFamily == 'legacy') ? 'modImplementation' : 'implementation'
        add(modConfiguration, "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}")
        add(modConfiguration, "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}")
        if (rootProject.hasProperty('terra_rasa_version') && project.name != 'terra-rasa' && project.name != 'testhost') {
            add(modConfiguration, "dev.terrarasa:terra-rasa-mc${minecraftVersion}:${rootProject.terra_rasa_version}")
            include "dev.terrarasa:terra-rasa-mc${minecraftVersion}:${rootProject.terra_rasa_version}"
        }
    }

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def mixinPrefix = project.ext.find('mixinPrefix') ?: project.ext.modArchiveName.replace('-', '')
    def expandedValues = [
            version: project.version,
            minecraft_version: minecraftVersion,
            loader_version: neoforgeLoader ? rootProject.neoforge_version : rootProject.fabric_loader_version,
            fabric_api_version: rootProject.fabric_api_version,
            java_version: javaVersion.toString(),
            terra_rasa_version: rootProject.findProperty('terra_rasa_version') ?: '',
            mixins_config: "${mixinPrefix}-${minecraftFamily}.mixins.json"
    ]
    inputs.properties expandedValues
    filesMatching('fabric.mod.json') {
        expand expandedValues
    }
    filesMatching('META-INF/neoforge.mods.toml') {
        expand expandedValues
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
    withSourcesJar()
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    if (neoforgeLoader) {
        jvmArgs '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED'
    }
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { "LICENSE_${project.ext.modArchiveName}" }
    }
}
