name: Release

on:
  push:
    tags: ["v*"]

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check release tag
        id: version
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          minecraft="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match mod_version $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minecraft=$minecraft" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew clean build

      - name: Prepare release assets and notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MINECRAFT: ${{ steps.version.outputs.minecraft }}
        run: |
          set -euo pipefail
          asset="build/libs/terra-rasa-mc${MINECRAFT}-${VERSION}.jar"
          test -f "$asset"
          mkdir -p dist
          cp "$asset" dist/
          (cd dist && sha256sum "$(basename "$asset")" > SHA256SUMS)
          awk -v heading="## $VERSION" '$0 == heading { show=1; next } show && /^## / { exit } show { print }' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.jar dist/SHA256SUMS
          --verify-tag --latest --title "Terra Rasa $VERSION"
          --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Dispatch Modrinth publishing workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh workflow run modrinth.yml
          --repo "$GH_REPO"
          --ref main
          --field tag="$GITHUB_REF_NAME"
