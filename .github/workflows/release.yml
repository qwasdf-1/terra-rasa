name: Release

on:
  push:
    tags: ["v*"]

permissions:
  actions: write
  contents: write

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: targets
        run: echo "matrix=$(jq -c . gradle/minecraft-targets.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Java ${{ matrix.java_version }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test Minecraft ${{ matrix.minecraft_version }}
        run: >-
          ./gradlew clean build
          -Pminecraft_version=${{ matrix.minecraft_version }}
          -Pfabric_loader_version=${{ matrix.fabric_loader_version }}
          -Pfabric_api_version=${{ matrix.fabric_api_version }}
          -Pjava_version=${{ matrix.java_version }}

      - name: Stage runtime jar
        env:
          MINECRAFT: ${{ matrix.minecraft_version }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          jar="build/libs/terra-rasa-mc${MINECRAFT}-${version}.jar"
          test -f "$jar"
          mkdir -p dist
          cp "$jar" dist/

      - uses: actions/upload-artifact@v7
        with:
          name: terra-rasa-${{ matrix.minecraft_version }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 1

  publish-github-release:
    needs: [targets, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: terra-rasa-*
          path: dist
          merge-multiple: true

      - name: Verify target jars and prepare release notes
        id: version
        env:
          TARGETS_JSON: ${{ needs.targets.outputs.matrix }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match mod_version $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          while IFS= read -r minecraft; do
            test -f "dist/terra-rasa-mc${minecraft}-${version}.jar" || {
              echo "Missing runtime jar for Minecraft $minecraft" >&2
              exit 1
            }
          done < <(jq -r '.include[].minecraft_version' <<< "$TARGETS_JSON")
          (cd dist && sha256sum *.jar > SHA256SUMS)
          awk -v heading="## $version" '$0 == heading { show=1; next } show && /^## / { exit } show { print }' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.jar dist/SHA256SUMS
          --verify-tag --latest --title "Terra Rasa $VERSION"
          --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Dispatch Modrinth publishing workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh workflow run modrinth.yml
          --repo "$GH_REPO"
          --ref main
          --field tag="$GITHUB_REF_NAME"
