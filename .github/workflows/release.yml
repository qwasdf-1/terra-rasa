name: Release

on:
  push:
    tags: ["v*"]

permissions:
  actions: write
  contents: write

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: targets
        run: echo "matrix=$(jq -c . gradle/release-targets.json)" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target_label }} ${{ matrix.loader }})
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the Gradle JVM
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Same rule as CI: the row's java_version is the compile toolchain, passed below as
          # -Pjava_version, while the Gradle JVM itself must be 25 or newer because the
          # buildscript resolves fabric-loom 1.18.4 on every row, NeoForge rows included.
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # Fabric targets build through Loom with Fabric Loader and Fabric API; NeoForge targets
      # build through ModDevGradle against the pinned NeoForge version. Each row produces one
      # family-universal jar covering all versions listed in matrix.minecraft_versions.
      - name: Build and test ${{ matrix.target_label }} (${{ matrix.loader }})
        run: |
          set -euo pipefail
          case "${{ matrix.loader }}" in
            fabric)
              args=(
                -Ploader=${{ matrix.loader }}
                -Ploom_version=${{ matrix.loom_version }}
                -Pfabric_loader_version=${{ matrix.fabric_loader_version }}
                -Pfabric_api_version=${{ matrix.fabric_api_version }}
                -Pfabric_api_range=${{ matrix.fabric_api_range }}
              )
              ;;
            neoforge)
              args=(
                -Ploader=${{ matrix.loader }}
                -Pmoddev_version=${{ matrix.moddev_version }}
                -Pneoforge_version=${{ matrix.neoforge_version }}
                -Ploader_range=${{ matrix.loader_range }}
              )
              ;;
            *)
              echo "Unsupported loader '${{ matrix.loader }}' for ${{ matrix.target_label }}" >&2
              exit 1
              ;;
          esac
          ./gradlew clean build "${args[@]}" \
            -Pminecraft_version=${{ matrix.build_minecraft_version }} \
            -Ptarget_label=${{ matrix.target_label }} \
            -Pminecraft_range="${{ matrix.minecraft_range }}" \
            -Pjava_version=${{ matrix.java_version }}

      - name: Stage runtime jar
        env:
          TARGET_LABEL: ${{ matrix.target_label }}
          LOADER: ${{ matrix.loader }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          loader_tag=""
          case "$LOADER" in
            fabric) ;;
            neoforge) loader_tag="-neoforge" ;;
            *) echo "Unsupported loader '$LOADER' for $TARGET_LABEL" >&2; exit 1 ;;
          esac
          jar="build/libs/terra-rasa-${TARGET_LABEL}${loader_tag}-${version}.jar"
          test -f "$jar"
          mkdir -p dist
          cp "$jar" dist/

      - uses: actions/upload-artifact@v7
        with:
          name: terra-rasa-${{ matrix.target_label }}-${{ matrix.loader }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 1

  publish-github-release:
    needs: [targets, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: terra-rasa-*
          path: dist
          merge-multiple: true

      - name: Verify target jars and prepare release notes
        id: version
        env:
          TARGETS_JSON: ${{ needs.targets.outputs.matrix }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match mod_version $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          while IFS=$'\t' read -r target_label loader; do
            loader_tag=""
            case "$loader" in
              fabric) ;;
              neoforge) loader_tag="-neoforge" ;;
              *) echo "Unsupported loader '$loader' for $target_label" >&2; exit 1 ;;
            esac
            test -f "dist/terra-rasa-${target_label}${loader_tag}-${version}.jar" || {
              echo "Missing runtime jar for $target_label ($loader)" >&2
              exit 1
            }
          done < <(jq -r '.include[] | "\(.target_label)\t\(.loader // "fabric")"' <<< "$TARGETS_JSON")
          expected_count="$(jq '.include | length' <<< "$TARGETS_JSON")"
          actual_count="$(find dist -maxdepth 1 -name "terra-rasa-*-${version}.jar" | wc -l)"
          test "$actual_count" -eq "$expected_count" || {
            echo "Expected $expected_count runtime jars, found $actual_count" >&2
            exit 1
          }
          (cd dist && sha256sum *.jar > SHA256SUMS)
          awk -v heading="## $version" '$0 == heading { show=1; next } show && /^## / { exit } show { print }' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.jar dist/SHA256SUMS
          --verify-tag --latest --title "Terra Rasa $VERSION"
          --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Dispatch Modrinth publishing workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh workflow run modrinth.yml
          --repo "$GH_REPO"
          --ref main
          --field tag="$GITHUB_REF_NAME"

      - name: Dispatch CurseForge publishing workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh workflow run curseforge.yml
          --repo "$GH_REPO"
          --ref main
          --field tag="$GITHUB_REF_NAME"
