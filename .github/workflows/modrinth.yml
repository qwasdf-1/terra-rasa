name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag, for example v0.3.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || vars.MODRINTH_PROJECT_ID != ''
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      matrix: ${{ steps.release.outputs.matrix }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Read release target jars
        id: release
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          version="$(git show "$RELEASE_TAG:gradle.properties" | sed -n 's/^mod_version=//p')"
          test -n "$version"
          test "$RELEASE_TAG" = "v$version" || {
            echo "Release tag $RELEASE_TAG does not match mod_version $version" >&2
            exit 1
          }
          release_json="$(gh release view "$RELEASE_TAG" --json assets)"
          targets="$(jq -c --arg version "$version" '
            [.assets[].name
              | select(startswith("terra-rasa-mc") and endswith("-" + $version + ".jar"))
              | (ltrimstr("terra-rasa-mc") | rtrimstr("-" + $version + ".jar")) as $minecraft
              | select($minecraft | test("^[0-9]+(\\.[0-9]+)+$"))
              | {minecraft_version:$minecraft, jar_name:("terra-rasa-mc" + $minecraft + "-" + $version + ".jar")}]
            | unique_by(.minecraft_version)
          ' <<< "$release_json")"
          test "$(jq 'length' <<< "$targets")" -gt 0 || {
            echo "No Terra Rasa runtime jars for version $version are attached to $RELEASE_TAG" >&2
            exit 1
          }

          if git cat-file -e "$RELEASE_TAG:gradle/minecraft-targets.json" 2>/dev/null; then
            expected="$(git show "$RELEASE_TAG:gradle/minecraft-targets.json" | jq -c '[.include[].minecraft_version] | unique | sort')"
            actual="$(jq -c '[.[].minecraft_version] | unique | sort' <<< "$targets")"
            test "$actual" = "$expected" || {
              echo "Release jars do not match the tagged Minecraft target matrix" >&2
              echo "Expected: $expected" >&2
              echo "Found:    $actual" >&2
              exit 1
            }
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          matrix="$(jq -cn --argjson include "$targets" '{include:$include}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  project:
    if: github.event_name == 'workflow_dispatch' || vars.MODRINTH_PROJECT_ID != ''
    runs-on: ubuntu-latest
    outputs:
      project_id: ${{ steps.project.outputs.project_id }}
      fabric_api_id: ${{ steps.fabric_api.outputs.project_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve Modrinth project ID
        id: project
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          EXPECTED_SOURCE_URL: https://github.com/qwasdf-1/terra-rasa
          MODRINTH_USER_AGENT: qwasdf-1/terra-rasa-github-publisher
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          result="$(python3 .github/scripts/resolve_modrinth_project.py)"
          project_id="$(jq -er '.id' <<< "$result")"
          project_slug="$(jq -er '.slug' <<< "$result")"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "Resolved Terra Rasa Modrinth project: $project_slug ($project_id)." >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve Fabric API project ID
        id: fabric_api
        run: |
          set -euo pipefail
          project="$(curl --fail-with-body --silent --show-error -H 'User-Agent: qwasdf-1/terra-rasa-github-publisher' https://api.modrinth.com/v2/project/fabric-api)"
          [[ "$(jq -er '.slug' <<< "$project")" == "fabric-api" ]]
          echo "project_id=$(jq -er '.id' <<< "$project")" >> "$GITHUB_OUTPUT"

  publish:
    needs: [release, project]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release.outputs.matrix) }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      PROJECT_ID: ${{ needs.project.outputs.project_id }}
      FABRIC_API_ID: ${{ needs.project.outputs.fabric_api_id }}
      VERSION: ${{ needs.release.outputs.version }}
      MINECRAFT: ${{ matrix.minecraft_version }}
      JAR_NAME: ${{ matrix.jar_name }}
    steps:
      - name: Download and verify release jar
        run: |
          set -euo pipefail
          test -n "$MODRINTH_TOKEN" || { echo "Set MODRINTH_TOKEN with VERSION_CREATE permission" >&2; exit 1; }
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern "$JAR_NAME" --pattern SHA256SUMS --dir dist
          expected="$(awk -v name="$JAR_NAME" '$2 == name { print $1 }' dist/SHA256SUMS)"
          actual="$(sha256sum "dist/$JAR_NAME" | cut -d ' ' -f 1)"
          test -n "$expected" && test "$actual" = "$expected" || {
            echo "SHA-256 verification failed for $JAR_NAME" >&2
            exit 1
          }
          gh release view "$RELEASE_TAG" --json body --jq .body > "$RUNNER_TEMP/changelog.md"
          test -s "$RUNNER_TEMP/changelog.md"

      - name: Publish Minecraft ${{ matrix.minecraft_version }} version to Modrinth
        run: |
          set -euo pipefail
          version_number="${VERSION}-mc${MINECRAFT}"
          version_name="Terra Rasa $VERSION (Minecraft $MINECRAFT)"
          environment="server_only"
          case "$VERSION" in
            0.1.0|0.2.0) environment="dedicated_server_only" ;;
          esac
          existing_response="$RUNNER_TEMP/existing-version.json"
          if ! existing_status="$(curl --silent --show-error --output "$existing_response" --write-out '%{http_code}' \
            -H 'User-Agent: qwasdf-1/terra-rasa-github-publisher' \
            "https://api.modrinth.com/v2/project/${PROJECT_ID}/version/${version_number}")"; then
            echo "Could not check whether Modrinth version $version_number already exists." >&2
            test ! -s "$existing_response" || cat "$existing_response" >&2
            exit 1
          fi

          if [[ "$existing_status" == "200" ]]; then
            expected_sha512="$(sha512sum "dist/$JAR_NAME" | cut -d ' ' -f 1)"
            existing_sha512="$(jq -r --arg jar "$JAR_NAME" '.files[] | select(.filename == $jar and .primary == true) | .hashes.sha512' "$existing_response" | head -n 1)"
            if jq -e \
              --arg project "$PROJECT_ID" \
              --arg version "$version_number" \
              --arg name "$version_name" \
              --arg minecraft "$MINECRAFT" \
              --arg environment "$environment" \
              --arg fabric "$FABRIC_API_ID" \
              --rawfile changelog "$RUNNER_TEMP/changelog.md" \
              '.project_id == $project
                and .version_number == $version
                and .name == $name
                and .changelog == $changelog
                and .game_versions == [$minecraft]
                and .loaders == ["fabric"]
                and .version_type == "release"
                and .environment == $environment
                and .status == "listed"
                and any(.dependencies[]; .project_id == $fabric and .dependency_type == "required")' \
              "$existing_response" >/dev/null && [[ "$existing_sha512" == "$expected_sha512" ]]; then
              echo "Modrinth version $version_number already matches the release asset; skipping upload."
              exit 0
            fi
            echo "Modrinth version $version_number already exists but its metadata or file differs from this release." >&2
            exit 1
          elif [[ "$existing_status" != "404" ]]; then
            echo "Could not check existing Modrinth version $version_number (HTTP $existing_status):" >&2
            cat "$existing_response" >&2
            exit 1
          fi

          jq -n --rawfile changelog "$RUNNER_TEMP/changelog.md" \
            --arg name "$version_name" \
            --arg version "$version_number" \
            --arg project "$PROJECT_ID" \
            --arg minecraft "$MINECRAFT" \
            --arg environment "$environment" \
            --arg fabric "$FABRIC_API_ID" \
            '{name:$name, version_number:$version, changelog:$changelog, dependencies:[{project_id:$fabric,dependency_type:"required"}], game_versions:[$minecraft], version_type:"release", loaders:["fabric"], environment:$environment, featured:false, status:"listed", project_id:$project, file_parts:["modfile"], primary_file:"modfile"}' \
            > "$RUNNER_TEMP/modrinth-version.json"
          response_file="$RUNNER_TEMP/modrinth-response.json"
          if ! http_status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H 'User-Agent: qwasdf-1/terra-rasa-github-publisher' \
            -F "data=@$RUNNER_TEMP/modrinth-version.json;type=application/json" \
            -F "modfile=@dist/$JAR_NAME" \
            https://api.modrinth.com/v2/version)"; then
            echo "Could not connect to the Modrinth version upload endpoint." >&2
            test ! -s "$response_file" || cat "$response_file" >&2
            exit 1
          fi
          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            echo "Modrinth version upload failed with HTTP $http_status:" >&2
            if ! jq -e . "$response_file" >/dev/null 2>&1; then
              cat "$response_file" >&2
            else
              jq -r 'if type == "object" then [(.error // empty), (.description // empty)] | map(select(length > 0)) | join(": ") else tostring end' "$response_file" >&2
            fi
            exit 1
          fi
          jq -er 'select(.id and .version_number) | "Published Modrinth version \(.version_number) (\(.id))"' "$response_file"
