name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: targets
        run: echo "matrix=$(jq -c . gradle/minecraft-targets.json)" >> "$GITHUB_OUTPUT"

  documentation-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check local documentation boundary
        run: python3 scripts/check_doc_boundary.py

  build:
    name: build (${{ matrix.minecraft_version }} ${{ matrix.loader }})
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the Gradle JVM
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The row's java_version is the compile toolchain, passed below as -Pjava_version. The
          # Gradle JVM itself must be 25 or newer: the buildscript resolves fabric-loom 1.18.4 on
          # every row - NeoForge rows carry no loom_version of their own and take the default -
          # and that version asks for a JVM 25+ Gradle to resolve its artifacts. The 1.21.11 rows
          # therefore compile to 21 bytecode under a 25 Gradle, which is how the local builds run.
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Each target row carries the loader's own toolchain properties: Loom, Fabric Loader and
      # Fabric API for Fabric rows, ModDevGradle and NeoForge for NeoForge rows.
      - name: Build and unit tests
        run: |
          set -euo pipefail
          case "${{ matrix.loader }}" in
            fabric)
              args=(
                -Ploader=${{ matrix.loader }}
                -Ploom_version=${{ matrix.loom_version }}
                -Pfabric_loader_version=${{ matrix.fabric_loader_version }}
                -Pfabric_api_version=${{ matrix.fabric_api_version }}
              )
              ;;
            neoforge)
              args=(
                -Ploader=${{ matrix.loader }}
                -Pmoddev_version=${{ matrix.moddev_version }}
                -Pneoforge_version=${{ matrix.neoforge_version }}
              )
              ;;
            *)
              echo "Unsupported loader '${{ matrix.loader }}' for Minecraft ${{ matrix.minecraft_version }}" >&2
              exit 1
              ;;
          esac
          ./gradlew build "${args[@]}" \
            -Pminecraft_version=${{ matrix.minecraft_version }} \
            -Pjava_version=${{ matrix.java_version }}

  # The real dedicated-server suite downloads the vanilla server and takes about ten minutes.
  # The suite still installs Fabric servers only, so NeoForge rows are skipped rather than run:
  # the NeoForge install path in gradle/integration-server.gradle and testing/ is not validated by
  # a live run yet. A job-level if cannot read the matrix context, so the loader gate is a step
  # condition repeated on every step of this job.
  integration:
    name: integration (${{ matrix.minecraft_version }} ${{ matrix.loader }})
    if: github.event_name == 'workflow_dispatch'
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        if: matrix.loader == 'fabric'

      - name: Install the Gradle JVM
        if: matrix.loader == 'fabric'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Same rule as the build job: the Gradle JVM is 25 (fabric-loom 1.18.4 requires it to
          # resolve), the row's java_version stays the compile toolchain (-Pjava_version below).
          java-version: '25'

      - name: Set up Gradle
        if: matrix.loader == 'fabric'
        uses: gradle/actions/setup-gradle@v6

      - name: Install uv
        if: matrix.loader == 'fabric'
        uses: astral-sh/setup-uv@v6

      - name: Integration suite
        if: matrix.loader == 'fabric'
        run: >-
          ./gradlew integrationTest
          -Ploader=fabric
          -Ploom_version=${{ matrix.loom_version }}
          -Pminecraft_version=${{ matrix.minecraft_version }}
          -Pfabric_loader_version=${{ matrix.fabric_loader_version }}
          -Pfabric_api_version=${{ matrix.fabric_api_version }}
          -Pjava_version=${{ matrix.java_version }}
