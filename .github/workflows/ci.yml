name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: targets
        run: echo "matrix=$(jq -c . gradle/minecraft-targets.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Java ${{ matrix.java_version }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and unit tests
        run: >-
          ./gradlew build
          -Pminecraft_version=${{ matrix.minecraft_version }}
          -Pfabric_loader_version=${{ matrix.fabric_loader_version }}
          -Pfabric_api_version=${{ matrix.fabric_api_version }}
          -Pjava_version=${{ matrix.java_version }}

  # The real dedicated-server suite downloads the vanilla server and takes about ten minutes.
  integration:
    if: github.event_name == 'workflow_dispatch'
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Java ${{ matrix.java_version }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Integration suite
        run: >-
          ./gradlew integrationTest
          -Pminecraft_version=${{ matrix.minecraft_version }}
          -Pfabric_loader_version=${{ matrix.fabric_loader_version }}
          -Pfabric_api_version=${{ matrix.fabric_api_version }}
          -Pjava_version=${{ matrix.java_version }}
